services:
  phpsocketio:
    build: .
    ports:
      - "2026:2026"
      - "2027:2027"
    volumes:
      - .:/app
    restart: unless-stopped
    tty: false
    stdin_open: false

  rooms:
    build: .
    ports:
      - "2030:2030"
      - "2031:2031"
    volumes:
      - .:/app
    command: sh -c "composer install --no-dev --optimize-autoloader --no-interaction && php examples/rooms/start.php start"
    restart: unless-stopped
    tty: false
    stdin_open: false

  ack:
    build: .
    ports:
      - "2032:2032"
      - "2033:2033"
    volumes:
      - .:/app
    command: sh -c "composer install --no-dev --optimize-autoloader --no-interaction && php examples/ack/start.php start"
    restart: unless-stopped
    tty: false
    stdin_open: false

  namespaces:
    build: .
    ports:
      - "2034:2034"
      - "2035:2035"
    volumes:
      - .:/app
    command: sh -c "composer install --no-dev --optimize-autoloader --no-interaction && php examples/namespaces/start.php start"
    restart: unless-stopped
    tty: false
    stdin_open: false

  phpcs:
    build: .
    volumes:
      - .:/app
    command: sh -c "composer install --no-interaction && vendor/bin/phpcs src/"
    profiles: [tools]

  phpstan:
    build: .
    volumes:
      - .:/app
    command: sh -c "composer install --no-interaction && vendor/bin/phpstan analyse"
    profiles: [tools]

  phpunit:
    build: .
    volumes:
      - .:/app
    # error_reporting=E_ALL matches CI's stricter default so PHP warnings
    # (e.g. uninitialized string offsets) fail here instead of only in CI.
    command: sh -c "composer install --no-interaction && php -d error_reporting=E_ALL vendor/bin/phpunit"
    profiles: [tools]